<div class="nav">
  <button routerLink="/cajero">Ir a Cajero 💳</button>
</div>

<div class="header">
  <h1>CAPITÁN BURGER</h1>
  <p>{{ fechaActual }}</p>
</div>

<!-- ... existing header code ... -->

<div class="grid">
  <div class="columna" *ngFor="let col of columnas">
    <div class="pedido" *ngFor="let p of col" [ngClass]="p.estado">
      
      <div class="pedido-header">
        <!-- Use the saved original index -->
        <h2>#{{ p.originalIndex }}</h2> 
      </div>

      <div class="pedido-body">
        <p class="nombre">{{ p.nombre }}</p>
        <p class="estado">{{ p.estado }}</p>
      </div>

      <div class="pedido-footer">
        <!-- Use p.originalIndex here too -->
        <button (click)="cambiarEstado(p.originalIndex)">
          {{
            p.estado === 'pendiente' ? 'Iniciar' :
            p.estado === 'preparacion' ? 'Finalizar' :
            'Entregar'
          }}
        </button>
      </div>
    </div>
  </div>
</div>
