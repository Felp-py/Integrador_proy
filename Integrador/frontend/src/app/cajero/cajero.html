<div class="contenedor">
    <div class="pedido">
        <h1>CAPITÁN BURGER </h1>
        <div class="lista-pedido">
            <div *ngFor="let item of carrito; let i = index" class="item">
                <div>
                    <strong>{{ item.nombre }}</strong>
                    <p>{{ item.tamano }}</p>
                    <small *ngIf="item.extras.length">
                        Extras: {{ item.extras.join(', ') }}
                    </small>
                    <br>
                    <small *ngIf="item.observacion">
                        Obs: {{ item.observacion }}
                    </small>
                </div>
                <div class="derecha-item">
                    <p>S/ {{ item.precio }}</p>
                    <button
                        class="eliminar"
                        (click)="eliminar(i)">
                        ✕
                    </button>
                </div>
            </div>
        </div>
        <div class="footer">
            <h2>Total: S/ {{ total }}</h2>
            <button
                class="confirmar"
                (click)="confirmarPedido()">
                Confirmar Pedido
            </button>
        </div>
    </div>
    <div class="panel">
        <div class="categorias">
            <button
                *ngFor="let c of categorias"
                [style.background]="c.color"
                (click)="categoriaSeleccionada = c.nombre">
                {{ c.nombre }}
            </button>
        </div>

        <div class="productos">
            <button
                *ngFor="let p of productosFiltrados"
                [style.border-color]="p.color"
                (click)="agregar(p)">
                <h3>{{ p.nombre }}</h3>
                <span>S/ {{ p.precio }}</span>
            </button>
        </div>
    </div>
</div>
<div
    class="modal-overlay"
    *ngIf="mostrarModal">
    <div class="modal-box">
        <h2>
            {{ productoSeleccionado?.nombre }}
        </h2>
        <p class="precio-modal">
            S/ {{ productoSeleccionado?.precio }}
        </p>
        <div class="extras-box">
            <h3>Tamaño</h3>
            <div class="extras">
                <button
                    *ngFor="let t of tamanos"
                    [class.activo]="tamanoSeleccionado === t"
                    (click)="tamanoSeleccionado = t">
                    {{ t }}
                </button>
            </div>
        </div>
        <div class="extras-box" *ngIf="!esBebidaOComplemento()">
            <h3>Ingredientes Extra</h3>
            <div class="extras">
                <button
                    *ngFor="let extra of ingredientesExtra"
                    (click)="toggleExtra(extra)"
                    [class.activo]="extrasSeleccionados.includes(extra)">
                    {{ extra }}
                </button>
            </div>
        </div>
        <div class="extras-box" *ngIf="!esBebidaOComplemento()">
            <h3>Observaciones</h3>
            <textarea
                [(ngModel)]="observacion"
                placeholder="Ej: sin cebolla, extra salsa...">
            </textarea>
        </div>
        <div class="acciones-modal">
            <button
                class="cancelar"
                (click)="cerrarModal()">
                Cancelar
            </button>
            <button
                class="agregar-btn"
                (click)="confirmarProducto()">
                Agregar al Pedido
            </button>
        </div>
    </div>
</div>
